[project]
name = "peeweare_showtime_notifier"
version = "0.1.0"
description = "A webapp to monitor and notify when showtimes are released for a movie"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.138.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pymongo>=4.17.0",
    "python-multipart>=0.0.32",
    "requests>=2.33.1",
]

[tool.fastapi]
entrypoint = "backend.main:app"
